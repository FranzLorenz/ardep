# Arduino Core for Zephyr - loader config for the ARDEP board (STM32G474VE).
# SPDX-License-Identifier: Apache-2.0
#
# First-cut: lean feature set so the loader fits the 192K slot0 on a 512K
# device. Digital GPIO + UART + LLEXT sketch loading only. ADC/PWM/I2C/SPI/CAN
# are deliberately left off here and enabled in a later build-out stage.

# Standalone firmware: the loader owns flash from the base, no MCUboot OTA.
# ARDEP's board defconfig defaults BOOTLOADER_MCUBOOT=y (needs slot1 for image
# signing); the Arduino flow does not use OTA, so turn it off here.
CONFIG_BOOTLOADER_MCUBOOT=n

# LLEXT: load sketches as ELF from the user_sketch flash partition.
CONFIG_LLEXT_STORAGE_WRITABLE=n
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LLEXT_HEAP_SIZE=32

# STM32G4 has a single-precision FPU.
CONFIG_FPU=y

# Dynamic threads/interrupts needed by the Arduino runtime.
# SHARED_INTERRUPTS pulls in arch/common/shared_irq.c, which provides the weak
# arch_irq_disconnect_dynamic that loader/llext_exports.c exports whenever
# DYNAMIC_INTERRUPTS is set (Cortex-M has no own disconnect_dynamic).
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_SHARED_INTERRUPTS=y
CONFIG_GEN_ISR_TABLES=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_MAIN_THREAD_PRIORITY=5

# No MPU constraints on the sketch region for now.
CONFIG_ARM_MPU=n
